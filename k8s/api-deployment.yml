apiVersion: apps/v1
kind: Deployment
metadata:
  name: echoagent-api
  namespace: echoagent
  labels:
    app: echoagent-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echoagent-api
  template:
    metadata:
      labels:
        app: echoagent-api
    spec:
      containers:
        - name: api
          image: ghcr.io/echoagent/echoagent:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: echoagent-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: echoagent-api
  namespace: echoagent
spec:
  type: ClusterIP
  selector:
    app: echoagent-api
  ports:
    - port: 8000
      targetPort: 8000

