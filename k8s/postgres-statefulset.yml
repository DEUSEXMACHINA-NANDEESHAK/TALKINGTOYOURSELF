apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: echoagent
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: "echoagent"
            - name: POSTGRES_USER
              value: "echo"
            - name: POSTGRES_PASSWORD
              value: "secret"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: echoagent
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echoagent-ingress
  namespace: echoagent
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: echoagent.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echoagent-api
                port:
                  number: 8000

