# docker-compose.dev.yml — Development overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

version: "3.8"

services:
  api:
    build:
      target: api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./src:/app/src:ro
    ports:
      - "8000:8000"

  worker:
    command: >
      celery -A src.workers.celery_app worker
      -l debug
      -c 1
      --without-heartbeat
      --without-mingle
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      - ./src:/app/src:ro

